name: PWA RONYZERA (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.json', 'ronyzera-icon-*.png', 'vendor/**', '.github/workflows/pwa.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 1 deploy por vez (pages exige)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar site
        env:
          TURN_JSON: ${{ secrets.TURN_JSON }}
        run: |
          mkdir -p _site
          cp index.html manifest.json ronyzera-icon-*.png _site/
          cp -r vendor _site/
          if [ -n "$TURN_JSON" ]; then
            printf '%s' "$TURN_JSON" > _site/turn.json
            sed -i 's|</head>|<meta name="ronyzera-turn" content="turn.json">\n</head>|' _site/index.html
          fi
          ls -la _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
