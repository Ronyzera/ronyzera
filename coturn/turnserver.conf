# ============================================================
# RONYZERA - coturn (relay de voz e tela)
# Destino: /etc/coturn/turnserver.conf
# Troque SENHA_FORTE antes de subir. Veja o fim do arquivo para
# o caso de servidor atras de roteador/NAT (external-ip).
# ============================================================
listening-port=3478

# ---- TLS: so use com dominio + certificado (Let's Encrypt) ----
# Sem dominio, mantenha comentado: use turn:IP:3478 e ?transport=tcp.
#tls-listening-port=5349
#cert=/etc/letsencrypt/live/turn.SEUDOMINIO/fullchain.pem
#pkey=/etc/letsencrypt/live/turn.SEUDOMINIO/privkey.pem

fingerprint
lt-cred-mech
realm=ronyzera
user=ronyzera:SENHA_FORTE

# ---- faixa de portas do relay (liberar UDP no firewall) ----
min-port=49160
max-port=49200

no-multicast-peers
no-loopback-peers
stale-nonce

# ---- Servidor atras de roteador (port-forward) ----
# Se o IP publico NAO esta na placa de rede do servidor, descomente
# e ajuste: primeiro o IP publico, depois o IP local da maquina.
#external-ip=IP_PUBLICO/IP_PRIVADO

# ---- Diagnostico (ligue so quando estiver testando) ----
#verbose
